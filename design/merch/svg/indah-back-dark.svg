<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" class="way-dark" role="img" aria-label="indah: a large indah bloom with the word indah and the line Beautiful designs with Python, surrounded by scattered stylised interface elements (chart, graph, chat, heatmap, bars, table)">
  <title>indah back print</title>
  <style>
    .way-light { --a:#b5296b; --a2:#e9a9c6; --b:#2e6d62; --b2:#9cc8bd; --ink:#241c22; }
    .way-dark  { --a:#f06ca6; --a2:#8d3f69; --b:#66b7a6; --b2:#3f7b70; --ink:#f1e7ee; }
    .wm  { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; letter-spacing:-0.03em; fill:var(--ink); }
    .lbl { font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:22px; letter-spacing:0.04em; fill:var(--ink); }
    .sub { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; letter-spacing:0; fill:var(--ink); }
  </style>

  <g transform="translate(0 25)">
  <text class="lbl" x="62" y="318">chart</text>
  <!-- chart, top left -->
  <g transform="translate(40 150) scale(0.78)">
    <path d="M24 172H581" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
    <path d="M24 150C90 130 120 76 190 92S300 150 360 104S470 44 581 62V172H24Z" fill="var(--a2)"/>
    <path d="M24 160C100 150 150 122 220 132S340 104 410 122S520 94 581 104" fill="none" stroke="var(--b)" stroke-width="8" stroke-linecap="round"/>
    <path d="M24 150C90 130 120 76 190 92S300 150 360 104S470 44 581 62" fill="none" stroke="var(--a)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="190" cy="92" r="10" fill="var(--a)"/>
    <circle cx="360" cy="104" r="10" fill="var(--a)"/>
    <circle cx="581" cy="62" r="10" fill="var(--a)"/>
  </g>

  <text class="lbl" x="655" y="318">graph</text>
  <!-- graph, top right -->
  <g transform="translate(585 5) scale(1.4)">
    <path d="M60 112L128 78M60 112L132 150M128 78L206 112M132 150L206 112M206 112L250 160" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="112" r="18" fill="var(--a)"/>
    <circle cx="128" cy="78" r="14" fill="var(--b)"/>
    <circle cx="132" cy="150" r="14" fill="var(--b2)"/>
    <circle cx="206" cy="112" r="22" fill="var(--a2)"/>
    <circle cx="250" cy="160" r="12" fill="var(--b)"/>
  </g>

  <text class="lbl" x="55" y="702">heatmap</text>
  <!-- heatmap, left of the mark -->
  <g transform="translate(55 484)">
    <rect x="0" y="0" width="54" height="54" rx="12" fill="var(--b2)"/>
    <rect x="64" y="0" width="54" height="54" rx="12" fill="var(--a2)"/>
    <rect x="128" y="0" width="54" height="54" rx="12" fill="var(--a)"/>
    <rect x="0" y="64" width="54" height="54" rx="12" fill="var(--a2)"/>
    <rect x="64" y="64" width="54" height="54" rx="12" fill="var(--a)"/>
    <rect x="128" y="64" width="54" height="54" rx="12" fill="var(--a)"/>
    <rect x="0" y="128" width="54" height="54" rx="12" fill="var(--b)"/>
    <rect x="64" y="128" width="54" height="54" rx="12" fill="var(--b2)"/>
    <rect x="128" y="128" width="54" height="54" rx="12" fill="var(--a2)"/>
  </g>

  <text class="lbl" x="715" y="702">chat</text>
  <!-- chat, right of the mark -->
  <g transform="translate(715 483)">
    <rect x="0" y="0" width="215" height="66" rx="22" fill="var(--b2)"/>
    <rect x="22" y="20" width="120" height="10" rx="5" fill="var(--b)"/>
    <rect x="22" y="38" width="80" height="10" rx="5" fill="var(--b)"/>
    <rect x="45" y="82" width="215" height="56" rx="20" fill="var(--a)"/>
    <rect x="68" y="104" width="130" height="10" rx="5" fill="var(--a2)"/>
    <circle cx="14" cy="176" r="8" fill="var(--ink)"/>
    <circle cx="40" cy="176" r="8" fill="var(--ink)"/>
    <circle cx="66" cy="176" r="8" fill="var(--ink)"/>
  </g>

  <text class="lbl" x="200" y="1014">bars</text>
  <!-- bars, lower left -->
  <g transform="translate(200 1007) scale(0.74)">
    <rect x="0" y="120" width="32" height="70" rx="8" fill="var(--b2)"/>
    <rect x="46" y="70" width="32" height="120" rx="8" fill="var(--a2)"/>
    <rect x="92" y="95" width="32" height="95" rx="8" fill="var(--b)"/>
    <rect x="138" y="30" width="32" height="160" rx="8" fill="var(--a)"/>
    <rect x="184" y="60" width="32" height="130" rx="8" fill="var(--a2)"/>
    <path d="M-8 198H224" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- the indah mark, identical to the chest print -->
  <g transform="translate(500 575) scale(14) translate(-16 -16)">
    <path d="M16 16C11.7 12.4 11.7 6 16 3.6C20.3 6 20.3 12.4 16 16Z" fill="var(--a)"/>
    <path d="M16 16C20.3 19.6 20.3 26 16 28.4C11.7 26 11.7 19.6 16 16Z" fill="var(--a)"/>
    <path d="M16 16C12.4 20.3 6 20.3 3.6 16C6 11.7 12.4 11.7 16 16Z" fill="var(--b)"/>
    <path d="M16 16C19.6 20.3 26 20.3 28.4 16C26 11.7 19.6 11.7 16 16Z" fill="var(--b)"/>
  </g>

  <text class="wm" x="500" y="880" font-size="125" text-anchor="middle">indah</text>
  <text class="sub" x="500" y="935" font-size="40" text-anchor="middle">Beautiful designs with Python</text>

  <text class="lbl" x="500" y="1014">table</text>
  <!-- table, bottom -->
  <g transform="translate(500 1029) scale(0.66)">
    <rect x="0" y="0" width="570" height="34" rx="12" fill="var(--b)"/>
    <rect x="0" y="58" width="150" height="14" rx="7" fill="var(--ink)"/>
    <rect x="200" y="58" width="170" height="14" rx="7" fill="var(--ink)"/>
    <rect x="450" y="58" width="120" height="14" rx="7" fill="var(--b2)"/>
    <rect x="0" y="92" width="150" height="14" rx="7" fill="var(--ink)"/>
    <rect x="200" y="92" width="170" height="14" rx="7" fill="var(--ink)"/>
    <rect x="450" y="88" width="120" height="22" rx="11" fill="var(--a)"/>
    <rect x="0" y="126" width="150" height="14" rx="7" fill="var(--ink)"/>
    <rect x="200" y="126" width="170" height="14" rx="7" fill="var(--ink)"/>
    <rect x="450" y="126" width="120" height="14" rx="7" fill="var(--b2)"/>
  </g>
  </g>
</svg>
